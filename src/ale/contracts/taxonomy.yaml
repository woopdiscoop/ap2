# ALE room-type taxonomy v1 — canonical keys (EN), labels (FR/EN), and the
# synonyms/abbreviations found on French drawings. Matching is done on the
# canonical form (accents, case and punctuation removed; see 0.2 RD §7), so
# "S. RÉUNION", "s reunion" and "S.REUNION" are the same synonym.
#
# default_macro_zone and service_core are Router proposals — the architect
# should review them (they are defaults; the Excel program overrides the zone).
#
# Known ambiguities: on French drawings "OFFICE" is a pantry/kitchenette, not an
# office (mapped to kitchenette); "CUISINE" is mapped to commercial_kitchen.
#
# v1.1.0 (2026-11-07): 50 types added for other tertiary programmes, based on the
# Uniclass 2015 SL (Spaces/locations) table v1.23 and the French ERP building types
# (M retail, N food service, R education, S libraries, U health, X sport, L/Y culture).
# The taxonomy also normalises labels read from REFERENCE plans (Phase 1), so it covers
# more types than a program usually uses. Category SPECIAL types (unknown, outdoor_space)
# are recognised but never generated.
version: "1.1.0"
types:
