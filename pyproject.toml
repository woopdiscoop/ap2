[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ale"
dynamic = ["version"]
description = "ALE - Architectural Layout Engine (standalone workstation tool)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "shapely>=2.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
cad = ["ezdxf>=1.3"]
pdf = ["pymupdf>=1.24"]
raster = ["opencv-python-headless>=4.9", "Pillow>=10"]
excel = ["pandas>=2.1", "openpyxl>=3.1"]
vlm = ["anthropic>=1.0"]
all = [
    "ezdxf>=1.3",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "Pillow>=10",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "anthropic>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-shapely",
]

[project.scripts]
ale = "ale.cli:main"

[tool.hatch.version]
path = "src/ale/__init__.py"

[tool.hatch.build.targets.wheel]
# src layout; every file under src/ale (including templates/* and
# contracts/*.json|*.yaml) is shipped as package data.
packages = ["src/ale"]

[tool.hatch.build.targets.sdist]
include = ["src/ale", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test",
    "windows_only: runs only on Windows",
    "needs_tool: needs an external tool (ODA, AutoCAD, ...)",
]

[tool.coverage.run]
source = ["ale"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
# specs/ holds Markdown specifications (with pseudo-code blocks), not project code.
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/ale"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
