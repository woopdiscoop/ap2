# ALE room-type taxonomy v1 — canonical keys (EN), labels (FR/EN), and the
# synonyms/abbreviations found on French drawings. Matching is done on the
# canonical form (accents, case and punctuation removed; see 0.2 RD §7), so
# "S. RÉUNION", "s reunion" and "S.REUNION" are the same synonym.
#
# default_macro_zone and service_core are Router proposals — the architect
# should review them (they are defaults; the Excel program overrides the zone).
#
# Known ambiguity: on French drawings "OFFICE" is a pantry/kitchenette, not an
# office. It is mapped to kitchenette here.
version: "1.0.0"
types:
