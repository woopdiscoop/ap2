# ============================================================================
# ALE 2.2 — SEED RULEBOOK (template)                     to be filled by the architect
# ============================================================================
# This file is the generator's knowledge before any plan has been mined. Phase 3
# (layout generation) runs on it alone; later, mined statistics are blended in.
#
# HOW TO FILL IT
#   * Replace every `null` with a number. Nothing else needs to change.
#   * A room type you do not need yet: delete its whole block under `types:`.
#     ALE then refuses any program that uses that type, and says so.
#   * Check your work at any time:
#         python -m ale.contracts.validate rulebook seed_rulebook.yaml
#
# UNITS & MEANINGS
#   aspect     long side / short side of the room rectangle (1.0 = square, 2.0 = 1:2).
#              HARD LIMIT (architect rule): never beyond 2:1 — so p90 must be <= 2.0.
#              PRE-FILLED p10 1.0 / p90 2.0 for every type; p50 1.4 is a Router default for the
#              typical shape. Narrow a type's band if you wish (e.g. meeting rooms 1.2-1.6): inside the
#              hard limit the band is a preference. Rule: 1.0 <= p10 <= p50 <= p90 <= 2.0.
#              On the 0.10 m grid every target area fits within 2:1 and the area tolerance.
#   area_m2    typical net area of ONE room of that type, in m2 (p10 <= p50 <= p90).
#              Used for sanity checks and blending, not as targets (targets come from the Excel program).
#   orientation  preference for the façade a room faces, per compass direction, from
#              -1.0 (avoid) to +1.0 (strongly prefer); 0.0 = indifferent.
#              Example for an office: S 1.0, E 0.5, N 0.3, W -0.5.
#   adjacency.pairs   [type_a, type_b, p] = probability, 0.0-1.0, that two such rooms share
#              a wall or a door when both exist in a plan. 0.5 = neutral;
#              close to 1 = should touch; close to 0 = should not touch.
#              Write each pair once, either order. A type may pair with itself (office, office).
#   adjacency.default_p   p used for every pair you do not list.
#   core_offset  where the service core (sanitary, technical, IT, stairs, lifts) sits relative
#              to the footprint centre, as a fraction of footprint width (dx) and depth (dy):
#              0.0 / 0.0 = centred; dx -0.5 = against the left (-x) edge, dy +0.5 = against the
#              top (+y) edge, in the axes of the site drawing (not compass directions). Range -0.5..+0.5.
#
# VALUES TO SUPPLY: 23 types x (3 area + 4 orientation) = 161,
#   + 30 listed adjacency p + 1 default_p + 2 core offset + author/date = 196 entries
#   (aspect is pre-filled; review it).
#   Fill only the types you need for the first projects; the rest can be deleted.
# ============================================================================

