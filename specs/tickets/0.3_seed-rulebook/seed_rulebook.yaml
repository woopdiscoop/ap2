# ALE seed rulebook — DRAFT (2026-11-09), written by the Router agent for the architect to validate.
# Sources of the values: common French tertiary programming practice (individual offices 9–18 m²,
# meeting rooms ~2 m²/person, accessible WC ≥ 1.5 m turning circle ≈ 4.5 m², etc.) and a temperate-climate
# orientation logic (France / Morocco): workspaces avoid west (afternoon overheating), break areas seek south,
# service/IT rooms prefer the north side. Proportions follow the architect's rule (1:1 to 2:1; p50 1.4 is a default).
# EVERY value is a proposal: change anything that does not match your practice, then validate with
#   python -m ale.contracts.validate rulebook specs/tickets/0.3_seed-rulebook/seed_rulebook.yaml
